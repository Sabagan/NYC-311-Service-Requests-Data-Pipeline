
services:
  kafka:
    image: apache/kafka:4.1.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
    volumes:
      - kafka-data:/tmp/kraft-combined-logs

  # Batch pipeline (Part 1).
  # Runs only when explicitly requested using the batch profile.
  batch:
    build: .
    image: nyc311-batch
    profiles: ["batch"]
    working_dir: /app
    volumes:
      - .:/app
    command:
      - bash
      - -c
      - |
        set -e
        python src/batch/clean_requests.py
        python src/batch/convert_to_parquet.py
        python src/batch/benchmark_layouts.py

  # Streaming pipeline (Part 2).
  streaming:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./data/processing:/app/data/processing:ro
      - ./output:/app/output
      - stream-runs:/app/runs
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: nyc311
      POSTGRES_PASSWORD: nyc311
      POSTGRES_DB: nyc311
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyc311 -d nyc311"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pg-data:/var/lib/postgresql/data
  serve:
    build: .
    # Only runs when asked for: docker compose run --rm --build serve
    profiles: [serve]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: nyc311
      PGPASSWORD: nyc311
      PGDATABASE: nyc311
    volumes:
      - ./data/processing:/app/data/processing:ro
      - ./output:/app/output
    command: ["python", "-u", "docker/run_serve.py"]
volumes:
  kafka-data:
  stream-runs:
  pg-data:
